version: 2
updates:
  # Gradle dependencies, including the version catalog in gradle/libs.versions.toml.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # AGP 9.5 breaks every Robolectric test with InvalidJarIndexError (a stale META-INF/INDEX.LIST
      # in the transformed test classpath jars). Remove this once a fixed AGP is out.
      - dependency-name: "com.android.application"
        versions: [">= 9.5"]
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*", "com.google.devtools.ksp*"]
  # The pinned workflow actions; Dependabot updates the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
